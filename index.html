<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ency</title>
<meta name="description" content="ency">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* single, committed theme: the mesh is the page, and it is dark */
  :root {
    --paper: #232323;
    --ink:   #c0c0c0;
    --dim:   #6f6f6f;
    --faint: #3a3a3a;
    --mono:  ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--paper); touch-action: pan-x pan-y; }
  body {
    color: var(--ink);
    font: 12px/1.6 var(--mono);
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }

  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* --- the only two things over the mesh --- */

  .foot {
    position: fixed;
    left: 50%;
    bottom: max(38px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 13px;
  }
  .foot .line {
    font-size: 10px;
    letter-spacing: 0.24em;
    color: var(--dim);
  }

  form.field {
    display: flex;
    align-items: center;
    gap: 3px;
    width: min(320px, 78vw);
    padding: 3px 3px 3px 15px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    transition: border-color 140ms ease;
  }
  form.field:focus-within { border-color: rgba(255, 255, 255, 0.28); }
  form.field input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: 0;
    color: var(--ink);
    font: 12px/1 var(--mono);
    letter-spacing: 0.06em;
    padding: 9px 0;
  }
  form.field input::placeholder { color: var(--faint); }
  form.field button {
    flex: none;
    width: 29px; height: 29px;
    display: grid; place-items: center;
    border: 1px solid transparent;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--ink);
    font: 12px/1 var(--mono);
    cursor: pointer;
    transition: background 140ms ease;
  }
  form.field button:hover { background: rgba(255, 255, 255, 0.16); }
  form.field.done { border-color: rgba(255, 255, 255, 0.3); }

  /* the field breathes once as the address leaves it */
  form.field.flash { animation: fieldFlash 760ms cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fieldFlash {
    0%   { border-color: rgba(255,255,255,0.5); box-shadow: 0 0 0 0 rgba(255,255,255,0.16); }
    100% { border-color: rgba(255,255,255,0.1); box-shadow: 0 0 0 20px rgba(255,255,255,0); }
  }

  .foot .enter {
    appearance: none; cursor: pointer;
    font: 12px/1 var(--mono);
    letter-spacing: 0.12em;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 12px 26px;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    transition: border-color 140ms ease, background 140ms ease;
  }
  .foot .enter:hover { border-color: rgba(255, 255, 255, 0.28); background: rgba(255, 255, 255, 0.09); }

  .said {
    height: 0;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--dim);
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .said.on { opacity: 1; }
  .said.bad { color: #d08a8a; }

  /* --- lock --- */

  .lock {
    position: fixed;
    top: 18px; right: 18px;
    z-index: 3;
    width: 29px; height: 29px;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 9px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--faint);
    cursor: pointer;
    transition: color 160ms ease, border-color 160ms ease;
  }
  .lock:hover, .lock:focus-visible { color: var(--ink); border-color: rgba(255,255,255,0.22); }
  .lock svg { width: 12px; height: 12px; }

  /* --- nav: sections, mirroring the lock's inset on the other side --- */

  .nav {
    position: fixed;
    top: 18px; left: 18px;
    z-index: 3;
    display: flex; flex-direction: column;
    align-items: flex-start;
    gap: 7px;
  }
  .nav a {
    font: 12px/1 var(--mono);
    letter-spacing: 0.12em;
    color: var(--dim);
    text-decoration: none;
    padding: 3px 0;
    transition: color 160ms ease;
  }
  .nav a:hover, .nav a:focus-visible { color: var(--ink); }

  /* --- links: the lock's answer, opposite corner --- */

  .links {
    position: fixed;
    right: 20px;
    bottom: max(20px, env(safe-area-inset-bottom, 0px));
    z-index: 3;
    display: flex;
    gap: 16px;
  }
  .links a {
    width: 26px; height: 26px;          /* bare marks, but still a real target */
    display: grid; place-items: center;
    color: var(--faint);
    transition: color 160ms ease;
  }
  .links a:hover, .links a:focus-visible { color: var(--ink); }
  .links svg { width: 16px; height: 16px; }

  /* narrow screens: the centred field owns the bottom edge, so the row
     sits just above it rather than fighting it for the corner */
  @media (max-width: 560px) {
    .links {
      right: 16px;
      gap: 15px;
      bottom: calc(max(38px, env(safe-area-inset-bottom, 0px)) + 96px);
    }
  }

  /* --- modal: the expansive version of the same glass --- */

  .scrim {
    position: fixed; inset: 0;
    z-index: 10;
    display: grid; place-items: center;
    background: rgba(15, 15, 15, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  .modal {
    width: min(400px, 84vw);
    padding: 30px 30px 26px;
    display: flex; flex-direction: column; gap: 17px;
    border-radius: 22px;
    background: rgba(38, 38, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.11);
    backdrop-filter: blur(34px) saturate(1.5);
    -webkit-backdrop-filter: blur(34px) saturate(1.5);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.15),
      0 26px 64px rgba(0, 0, 0, 0.5);
    transform: scale(0.97);
    transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .scrim.on .modal { transform: scale(1); }

  .modal .lab { font-size: 10px; letter-spacing: 0.24em; color: var(--dim); }
  .modal .row { display: flex; gap: 8px; }
  .modal input {
    flex: 1; min-width: 0;
    padding: 11px 14px;
    background: rgba(0, 0, 0, 0.26);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: var(--ink);
    font: 12px/1 var(--mono);
    letter-spacing: 0.26em;
    outline: 0;
  }
  .modal input:focus { border-color: rgba(255, 255, 255, 0.3); }
  .modal input::placeholder { color: var(--faint); letter-spacing: 0.1em; }
  .modal .go {
    flex: none;
    padding: 0 17px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink);
    font: 11px/1 var(--mono);
    letter-spacing: 0.12em;
    cursor: pointer;
  }
  .modal .go:hover { background: rgba(255, 255, 255, 0.16); }
  .modal .err { font-size: 10px; letter-spacing: 0.1em; color: #d08a8a; min-height: 13px; }

  :focus-visible { outline: 1px solid rgba(255,255,255,0.5); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }

  /* iOS zooms into any focused input under 16px — give touch screens a
     16px input instead of capping the viewport's zoom */
  @media (pointer: coarse) {
    form.field input { font-size: 16px; }
    .modal input { font-size: 16px; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<button class="lock" id="lock" aria-label="Studio">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="4" y="10.5" width="16" height="11" rx="2.5"></rect>
    <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path>
  </svg>
</button>

<div class="foot" id="foot">
  <div class="line" id="line">say the word</div>
  <form class="field" id="sub" autocomplete="off">
    <input id="word" type="password" name="gate" placeholder="password" aria-label="Password" required>
    <button type="submit" aria-label="Enter">→</button>
  </form>
  <button class="enter" id="enter" hidden>enter room</button>
  <div class="said" id="said" role="status" aria-live="polite"></div>
</div>

<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Studio access">
    <div class="lab">studio</div>
    <form class="row" id="unlock">
      <input id="pw" type="password" placeholder="password" aria-label="Studio password" required>
      <button class="go" type="submit">enter</button>
    </form>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="/ribbon.js"></script>
<script src="/lobby.js"></script>
<script src="/page.js"></script>
<script>encyChrome();</script>
<script>
(async () => {
  'use strict';

  // the page is an app surface: no pinch, no double-tap zoom. iOS ignores
  // user-scalable=no in Safari, so its gesture events are blocked directly.
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('cv');
  const foot = document.getElementById('foot');
  const line = document.getElementById('line');
  const formEl = document.getElementById('sub');
  const said = document.getElementById('said');
  const enterBtn = document.getElementById('enter');
  let ribbon = null, lobby = null, savedMouse = null;

  // The lobby is a small centered window; the mesh keeps playing behind it,
  // pushed back — a little blurred, a little darker.
  function bootLobby(animate) {
    if (lobby) return lobby;
    foot.style.display = 'none';
    cv.style.transition = animate ? 'opacity 1200ms ease, filter 1200ms ease' : 'none';
    cv.style.opacity = '1';                          // undo the beam's dimming
    cv.style.filter = 'blur(4px) brightness(0.55)';
    if (ribbon) {
      if (savedMouse === null) savedMouse = ribbon.getState().mouse;
      ribbon.setState({ mouse: 0 });   // backdrop, not a toy, while the lobby is up
      ribbon.setPace(2);               // and blurred anyway — half rate is invisible
    }
    // starts as just you; the stream corrects the count on connect
    lobby = createLobby({ count: 1, reduced });
    return lobby;
  }

  // Esc steps back out: the room closes, the mesh sharpens, and the foot
  // returns as a doorway — one button for those already aboard.
  function exitLobby() {
    if (!lobby) return;
    lobby.destroy();
    lobby = null;
    if (ribbon) {
      ribbon.setPace(1);
      if (savedMouse !== null) ribbon.setState({ mouse: savedMouse });
    }
    cv.style.transition = 'filter 700ms ease, opacity 700ms ease';
    cv.style.filter = 'none';
    foot.style.display = '';
    foot.style.opacity = '1';        // it may still carry the beam's fade-out
    line.textContent = 'welcome back';
    formEl.style.display = 'none';
    enterBtn.hidden = false;
    said.classList.remove('on');
  }

  enterBtn.addEventListener('click', () => bootLobby(false));

  // Joined once from this device → the panel is already there on arrival.
  const remembered = localStorage.getItem('ency_joined') === '1';

  // Load the published preset before first paint so visitors never see the
  // defaults flash over to the real settings.
  let preset = null;
  try {
    const r = await Promise.race([
      fetch('/api/preset', { headers: { accept: 'application/json' } }),
      new Promise(res => setTimeout(() => res(null), 1500)),
    ]);
    if (r && r.ok) preset = (await r.json()).preset;
  } catch { /* fall through to defaults */ }

  // exposed for console poking, same as flowfield's window.__ff
  // try/catch so a zero-size first layout (hidden tab, restored session) can
  // take down the mesh without taking the gate with it — its own resize
  // handler rebuilds it once the viewport is real
  try {
    ribbon = window.__ribbon = createRibbon({
      canvas: cv,
      container: document.body,
      state: preset || {},
      skipIntro: remembered,     // lobby-first loads start on the formed mark
    });
  } catch (err) {
    console.warn('ribbon deferred:', err.message);
  }

  if (remembered) bootLobby();
  else {

  // ---- the gate, then the number
  const form = document.getElementById('sub');
  const input = document.getElementById('word');
  const line = document.getElementById('line');
  const said = document.getElementById('said');
  const say = (msg, bad) => {
    said.textContent = msg;
    said.classList.toggle('bad', !!bad);
    said.classList.add('on');
  };

  let stage = 'gate';    // -> 'phone' once the word is right
  let gateWord = '';

  // mirror of the server's rule, so a typo bounces without a round-trip:
  // strip formatting, a bare US 10-digit gets +1, then E.164's 7–15 digits
  function normalizePhone(raw) {
    let s = raw.replace(/[\s().\-]/g, '');
    if (/^\d{10}$/.test(s)) s = '+1' + s;
    else if (/^\d{11,15}$/.test(s)) s = '+' + s;
    return /^\+\d{7,15}$/.test(s) ? s : null;
  }

  // in the phone stage, letters never even land in the field
  input.addEventListener('input', () => {
    if (stage !== 'phone') return;
    const clean = input.value.replace(/[^\d\s().+\-]/g, '');
    if (clean !== input.value) input.value = clean;
  });

  function toPhoneStage() {
    stage = 'phone';
    form.classList.remove('flash');
    void form.offsetWidth;           // restart the breath if they re-enter
    form.classList.add('flash');
    input.value = '';
    input.type = 'tel';
    input.name = 'phone';
    input.autocomplete = 'tel';
    input.inputMode = 'tel';
    input.placeholder = 'phone number';
    input.setAttribute('aria-label', 'Phone number for texts');
    line.textContent = 'your number — texts, occasionally';
    said.classList.remove('on', 'bad');
    said.textContent = '';
    input.focus();
  }

  function backToGate(msg) {
    stage = 'gate'; gateWord = '';
    input.value = '';
    input.type = 'password';
    input.name = 'gate';
    input.autocomplete = 'off';
    input.placeholder = 'password';
    input.setAttribute('aria-label', 'Password');
    line.textContent = 'say the word';
    if (msg) say(msg, true);
  }

  // The beam: the field falls away and the mesh dims while the wormhole forms
  // from its characters; your digits fly in first; then the whole tunnel
  // collapses into the little lobby panel in the corner.
  function beamIn(phone) {
    localStorage.setItem('ency_joined', '1');
    const fromRect = input.getBoundingClientRect();
    foot.style.transition = 'opacity 450ms ease';
    foot.style.opacity = '0';
    cv.style.transition = 'opacity 1200ms ease';
    cv.style.opacity = '0.35';
    createWormhole({ text: phone, fromRect, reduced }, () => bootLobby(true).panel);
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value) return;

    if (stage === 'gate') {
      try {
        const r = await fetch('/api/gate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: value }),
        });
        if (r.ok) { gateWord = value; toPhoneStage(); }
        else if (r.status === 429) say('too many attempts — wait a while', true);
        else { say('no', true); input.select(); }
      } catch {
        say('no connection', true);
      }
      return;
    }

    const phone = normalizePhone(value);
    if (!phone) {
      say("that doesn't look like a phone number", true);
      input.select();
      return;
    }

    try {
      const r = await fetch('/api/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: gateWord, phone }),
      });
      const body = await r.json().catch(() => ({}));
      if (r.ok) {
        form.classList.add('done');
        beamIn(value);
      } else if (r.status === 401) {
        backToGate('the word changed — try again');   // rotated mid-session
      } else {
        say(body.error || 'that did not go through', true);
      }
    } catch {
      say('no connection', true);
    }
  });

  }  // end gate/mesh mode

  // ---- lock
  const scrim = document.getElementById('scrim');
  const pw = document.getElementById('pw');
  const err = document.getElementById('err');
  const open = on => {
    scrim.classList.toggle('on', on);
    if (on) setTimeout(() => pw.focus(), 60); else { pw.value = ''; err.textContent = ''; }
  };

  document.getElementById('lock').addEventListener('click', () => open(true));
  scrim.addEventListener('click', e => { if (e.target === scrim) open(false); });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (scrim.classList.contains('on')) { open(false); return; }
    if (lobby) exitLobby();          // step back out to the mesh
  });

  document.getElementById('unlock').addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    try {
      const r = await fetch('/api/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      if (r.ok) { location.href = '/studio'; return; }
      const body = await r.json().catch(() => ({}));
      err.textContent = r.status === 429 ? 'too many attempts — wait a while' : (body.error || 'no');
      pw.select();
    } catch {
      err.textContent = 'no connection';
    }
  });
})();
</script>
</body>
</html>
